<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e8e8e8;padding:20px}
.container{max-width:840px;margin:0 auto}
h1{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
h1 small{font-size:12px;color:#a0a0b0;font-weight:400}
.steps{background:#0a1d3a;border:1px solid #1a3a6a;border-radius:8px;padding:12px 16px;margin-bottom:14px;line-height:2;font-size:13px}
.steps strong{color:#4a90d9}
.steps code{background:#0f3460;padding:1px 6px;border-radius:3px;font-size:12px}
.screenshot-wrap{background:#0a1d3a;border:1px solid #1a3a6a;border-radius:8px;padding:10px;margin-bottom:14px}
.screenshot-wrap img{width:100%;border-radius:4px;display:block}
textarea{width:100%;height:150px;background:#0f3460;color:#e8e8e8;border:1px solid #2a2a4a;border-radius:8px;padding:12px;font-family:monospace;font-size:13px;resize:vertical;outline:none}
textarea:focus{border-color:#4a90d9}
.btn{padding:10px 24px;border:none;border-radius:6px;font-size:14px;cursor:pointer;background:#4a90d9;color:#fff;margin:10px 0}
.btn:hover{background:#357abd}
.btn-success{background:#27ae60;display:none}
.btn-success:hover{background:#219a52}
#result{margin-top:14px;display:none}
.stats{background:#16213e;padding:12px 16px;border-radius:8px;margin-bottom:10px;font-size:14px;color:#a0a0b0}
.stats strong{color:#27ae60;font-size:18px}
.table-wrap{background:#16213e;border-radius:8px;overflow:hidden}
.table-scroll{max-height:350px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:1}
th{background:#0f3460;padding:8px 12px;text-align:left;font-weight:500;color:#a0a0b0}
td{padding:6px 12px;border-bottom:1px solid #2a2a4a;color:#c0c0d0}
tr:hover td{background:#0a1d3a}
td.id{color:#4a90d9;font-family:monospace}
td.link a{color:#4a90d9;text-decoration:none;font-size:12px}
.export-area{margin-top:10px}
.log{margin-top:8px;padding:8px 12px;border-radius:6px;font-size:13px;display:none}
.log.error{display:block;background:#3d0a0a;border:1px solid #5c1010;color:#e74c3c}
.log.success{display:block;background:#0a3d1a;border:1px solid #27ae60;color:#27ae60}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#666;padding-top:14px;border-top:1px solid #2a2a4a}

<body>
<div class="container">
<h1>VK Ads 社群数据解析工具 <small>粘贴 JSON → 导出 Excel</small></h1>
<div class="steps">
<strong>使用步骤：</strong><br>
1. 打开 VK Ads → Audiences → 点人群包名称 → 打开社群列表<br>
2. 按 F12 → <strong>Network</strong> 标签 → <strong>Fetch/XHR</strong><br>
3. 在 <strong>Name</strong> 列找到开头为 <code>graphql</code> 的请求 → 点击<br>
4. 在右侧 <strong>Response</strong> 标签 → Ctrl+A 全选 → Ctrl+C 复制<br>
5. 粘贴到下方文本框 → 点「解析 JSON」→ 导出 Excel
