<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Ads 社群数据解析工具</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e8e8e8; padding: 20px; }
.container { max-width: 800px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
h1 small { font-size: 12px; color: #a0a0b0; font-weight: normal; }
.steps { background: #0a1d3a; border: 1px solid #1a3a6a; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; line-height: 1.8; font-size: 14px; }
.steps strong { color: #4a90d9; }
.steps code { background: #0f3460; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
textarea { width: 100%; height: 200px; background: #0f3460; color: #e8e8e8; border: 1px solid #2a2a4a; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; resize: vertical; outline: none; }
textarea:focus { border-color: #4a90d9; }
.btn { padding: 10px 24px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; background: #4a90d9; color: white; margin: 10px 0; }
.btn:hover { background: #357abd; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-success { background: #27ae60; }
.btn-success:hover { background: #219a52; }
#result { margin-top: 16px; display: none; }
.stats { background: #16213e; padding: 12px 16px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.stats span { color: #a0a0b0; }
.stats strong { color: #27ae60; font-size: 18px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; background: #16213e; border-radius: 8px; overflow: hidden; }
th { background: #0f3460; padding: 8px 12px; text-align: left; font-weight: 500; color: #a0a0b0; }
td { padding: 6px 12px; border-bottom: 1px solid #2a2a4a; }
tr:hover td { background: #0a1d3a; }
.log { margin-top: 10px; padding: 8px 12px; border-radius: 6px; font-size: 13px; display: none; }
.log.error { background: #3d0a0a; border: 1px solid #5c1010; display: block; }
.log.success { background: #0a3d1a; border: 1px solid #27ae60; display: block; }
.export-area { margin-top: 12px; display: none; }
.footer { margin-top: 30px; text-align: center; font-size: 12px; color: #a0a0b0; }
a { color: #4a90d9; text-decoration: none; }
a:hover { text-decoration: underline; }
.preview-wrap { max-height: 300px; overflow-y: auto; border-radius: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>📋 VK Ads 社群数据解析工具 <small>粘贴 JSON → 导出 Excel</small></h1>

  <div class="steps">
    <strong>使用步骤：</strong><br>
    1. 打开 VK Ads → Audiences → 点击人群包编辑 → 打开社群列表<br>
    2. 按 <code>F12</code> → <strong>Network</strong> 标签 → 点 <strong>Fetch/XHR</strong> 过滤<br>
    3. 找到包含 <strong>segmentWithResourcesById</strong> 或 <strong>graphql</strong> 的请求<br>
    4. 点 <strong>Response</strong> 标签 → <code>Ctrl+A</code> 全选 → <code>Ctrl+C</code> 复制<br>
    5. 粘贴到下方文本框 → 点「解析」
  </div>

  <textarea id="jsonInput" placeholder="在此粘贴 GraphQL 响应的 JSON 数据 ..."></textarea>
  <br>
  <button class="btn" id="parseBtn">🔍 解析 JSON</button>

  <div id="result">
    <div class="stats">
      <span>社群总数：<strong id="count">0</strong></span>
      <span id="dataSource"></span>
    </div>
    <div class="preview-wrap">
      <table><thead><tr>
        <th style="width:50px">序号</th>
        <th style="width:130px">社群 ID</th>
        <th>社群名称</th>
        <th style="width:100px">成员数</th>
        <th>链接</th>
      </tr></thead>
      <tbody id="tableBody"></tbody></table>
    </div>
    <div class="export-area" id="exportArea">
      <button class="btn btn-success" id="exportBtn">📥 导出 Excel</button>
    </div>
  </div>

  <div id="log"></div>

  <div class="footer">
    数据仅在本地处理，不会上传到任何服务器 · VK Ads 社群抓取工具
  </div>
</div>

<script>
var communitiesData = [];

document.getElementById('parseBtn').addEventListener('click', function() {
  var raw = document.getElementById('jsonInput').value.trim();
  var logEl = document.getElementById('log');

  if (!raw) { logEl.className = 'log error'; logEl.textContent = '请先粘贴 JSON 数据'; return; }

  try {
    var data = JSON.parse(raw);
    var communities = [];
    var seen = {};

    function walk(obj, depth) {
      if (depth > 15 || !obj || typeof obj !== 'object' || communities.length > 0) return;
      if (Array.isArray(obj)) {
        if (obj.length > 0 && obj[0] && obj[0].id && obj[0].name) {
          var hasGroups = false;
          for (var i = 0; i < obj.length; i++) { if (obj[i].__typename === 'AppsOrGroupsItem') { hasGroups = true; break; } }
          if (hasGroups) {
            for (var i = 0; i < obj.length; i++) {
              var item = obj[i];
              if (item.__typename === 'AppsOrGroupsItem' && item.id && item.name && !seen[item.id]) {
                seen[item.id] = true;
                communities.push({
                  id: String(item.id),
                  name: (item.name || '').trim().slice(0, 200),
                  members: item.membersCount || '',
                  link: 'https://vk.com/club' + item.id
                });
              }
            }
            return;
          }
        }
        return;
      }
      for (var k in obj) { walk(obj[k], depth + 1); if (communities.length > 0) return; }
    }
    walk(data, 0);

    if (communities.length === 0) {
      logEl.className = 'log error';
      logEl.textContent = '未找到社群数据。请确认粘贴的 JSON 中包含 "AppsOrGroupsItem"（从 Network 复制的 GraphQL 响应）。';
      return;
    }

    communitiesData = communities;
    document.getElementById('count').textContent = communities.length;
    document.getElementById('dataSource').textContent = '共 ' + communities.length + ' 条';

    var tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    for (var i = 0; i < communities.length; i++) {
      var c = communities[i];
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + (i+1) + '</td><td style="color:#4a90d9">' + c.id + '</td><td>' + c.name + '</td><td>' + c.members + '</td><td><a href="' + c.link + '" target="_blank">' + c.link + '</a></td>';
      tbody.appendChild(tr);
    }

    document.getElementById('result').style.display = 'block';
    document.getElementById('exportArea').style.display = 'block';
    logEl.className = 'log success';
    logEl.textContent = '成功解析 ' + communities.length + ' 个社群';
  } catch (err) {
    logEl.className = 'log error';
    logEl.textContent = 'JSON 解析失败: ' + err.message;
  }
});

document.getElementById('exportBtn').addEventListener('click', function() {
  if (communitiesData.length === 0) return;
  try {
    var excelData = communitiesData.map(function(c, i) {
      return { '序号': i+1, '社群ID': c.id, '社群名称': c.name, '社群链接': c.link, '成员数': c.members };
    });
    var wb = XLSX.utils.book_new();
    var ws = XLSX.utils.json_to_sheet(excelData);
    ws['!cols'] = [{ wch:6 }, { wch:15 }, { wch:40 }, { wch:50 }, { wch:12 }];
    XLSX.utils.book_append_sheet(wb, ws, '社群数据');

    var now = new Date();
    var ds = '' + now.getFullYear() + pad2(now.getMonth()+1) + pad2(now.getDate()) + '_' + pad2(now.getHours()) + pad2(now.getMinutes());
    var fn = 'VK社群数据_' + ds + '.xlsx';

    var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    var blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = fn; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 10000);

    var logEl = document.getElementById('log');
    logEl.className = 'log success';
    logEl.textContent = 'Excel 已导出: ' + fn;
  } catch(err) {
    var logEl = document.getElementById('log');
    logEl.className = 'log error';
    logEl.textContent = '导出失败: ' + err.message;
  }
});

function pad2(n) { return (n < 10 ? '0' : '') + n; }
</script>
</body>
</html>
